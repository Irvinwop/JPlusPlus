name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  differential:
    name: ${{ matrix.distribution }} ${{ matrix.java }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { distribution: temurin, java: '8' }
          - { distribution: temurin, java: '17' }
          - { distribution: temurin, java: '21' }
          - { distribution: semeru, java: '17' }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Keep the Java 21 compiler for all target releases
        run: |
          echo "JPP_JAVAC=$JAVA_HOME/bin/javac" >> "$GITHUB_ENV"
          echo "JPP_ECJ_JAVA=$JAVA_HOME/bin/java" >> "$GITHUB_ENV"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: ${{ matrix.distribution }}
          java-version: ${{ matrix.java }}
      - name: Install C++ frontend and independent Java compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 llvm-18-dev libclang-18-dev libclang-cpp18-dev ninja-build ecj
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=clang++-18 -DLLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm
          cmake --build build -j2
      - name: Compare native C++ against compiled Java
        env:
          JPP_TEST_JAVAS: java
        run: |
          export JPP_TEST_JAVACS="$JPP_JAVAC:$JAVA_HOME/bin/javac:$PWD/tests/ecj.sh"
          ctest --test-dir build --output-on-failure
