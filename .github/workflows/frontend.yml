name: GNU frontend

on:
  push:
    paths: ['src/**', 'runtime/**', 'tests/**', 'toolchain/**', 'tools/build-gnu.sh', 'CMakeLists.txt', '.github/workflows/frontend.yml']
  pull_request:
    paths: ['src/**', 'runtime/**', 'tests/**', 'toolchain/**', 'tools/build-gnu.sh', 'CMakeLists.txt', '.github/workflows/frontend.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    name: GNU extensions and independent Java compilers
    runs-on: ubuntu-24.04
    env:
      JPP_FRONTEND_WORK_DIR: ${{ github.workspace }}/build/frontend-cache
      JPP_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Keep the Java 21 tools
        run: |
          echo "JPP_JAVAC21=$JAVA_HOME/bin/javac" >> "$GITHUB_ENV"
          echo "JPP_JAVA21=$JAVA_HOME/bin/java" >> "$GITHUB_ENV"
          echo "JPP_ECJ_JAVA=$JAVA_HOME/bin/java" >> "$GITHUB_ENV"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: semeru
          java-version: '17'
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 llvm-18-dev libclang-18-dev libclang-cpp18-dev \
            libzstd-dev libgmp-dev ninja-build curl patch ecj
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: build/frontend-cache
          key: ${{ runner.os }}-llvm18.1.3-${{ hashFiles('toolchain/llvm18-compat.patch', 'tools/build-gnu.sh') }}
      - name: Build the compatibility frontend and J++
        run: tools/build-gnu.sh
      - name: Compare native GNU++23 with Java
        run: |
          export JPP_TEST_JAVACS="$JPP_JAVAC21:$JAVA_HOME/bin/javac:$PWD/tests/ecj.sh"
          export JPP_TEST_JAVAS="$JPP_JAVA21:$JAVA_HOME/bin/java"
          ctest --test-dir build-gnu --output-on-failure
