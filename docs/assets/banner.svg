<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
  <title id="title">J++ — Keep the algorithm. Change the language.</title>
  <desc id="desc">A C++ to Java transpiler built for competitive programming, producing readable standalone Java.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity=".035"/></pattern>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8ee6c2"/><stop offset="1" stop-color="#b0cfff"/></linearGradient>
  </defs>
  <rect width="1280" height="420" rx="22" fill="#101820"/>
  <rect width="1280" height="420" rx="22" fill="url(#grid)"/>
  <rect x="54" y="48" width="285" height="27" rx="13.5" fill="#8ee6c2" fill-opacity=".10" stroke="#8ee6c2" stroke-opacity=".25"/>
  <text x="70" y="66" font-family="monospace" font-size="12" letter-spacing="1.4" fill="#8ee6c2">COMPETITIVE PROGRAMMING FIRST</text>
  <text x="50" y="205" font-family="Inter,Arial,sans-serif" font-size="136" font-weight="800" letter-spacing="-10" fill="url(#glow)">J++</text>
  <text x="56" y="267" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="600" fill="#f1f5f9">Keep the algorithm.</text>
  <text x="56" y="305" font-family="Inter,Arial,sans-serif" font-size="28" fill="#aab9c8">Change the language.</text>
  <text x="56" y="365" font-family="monospace" font-size="14" fill="#7f95a7">C++23 in · Readable Java out · One source file</text>
  <rect x="637" y="60" width="582" height="300" rx="14" fill="#16232e" stroke="#354351"/>
  <path d="M637 103H1219" stroke="#354351"/>
  <circle cx="660" cy="82" r="4" fill="#f38b8b"/><circle cx="677" cy="82" r="4" fill="#f2d28c"/><circle cx="694" cy="82" r="4" fill="#8ee6c2"/>
  <text x="725" y="87" font-family="monospace" font-size="13" fill="#8da1b2">solution.cpp → Main.java</text>
  <g font-family="monospace" font-size="17">
    <text x="666" y="143" fill="#7f95a7">// your names, your control flow</text>
    <text x="666" y="181" fill="#b0cfff">vector&lt;int&gt; scores;</text>
    <text x="666" y="220" fill="#8ee6c2">ArrayList&lt;Integer&gt; scores;</text>
    <text x="666" y="276" fill="#aab9c8">$ j++ solution.cpp -r -v j21</text>
    <text x="666" y="314" fill="#f1f5f9">42</text>
  </g>
</svg>
